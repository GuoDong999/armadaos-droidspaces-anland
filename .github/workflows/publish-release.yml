name: Publish ArmadaOS Anland RootFS Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful armada-account build run ID; do not use the legacy z run
        required: true
        type: string
      release_tag:
        description: Git tag and Release name
        required: true
        type: string
        default: v0.1.0-anland.3

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified rootfs release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out release helper
        uses: actions/checkout@v5

      - name: Download successful build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ArmadaOS-Freedom-Anland-Droidspaces-aarch64 \
            --dir release-assets
          find release-assets -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Verify rootfs checksum and provenance
        shell: bash
        run: |
          set -euo pipefail
          rootfs=release-assets/ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz
          checksum=release-assets/ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz.sha256
          provenance=release-assets/ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz.source
          test -f "$rootfs"
          test -f "$checksum"
          test -f "$provenance"
          # Build sidecars may contain a runner-local path; compare the recorded digest, not that path.
          expected="$(awk 'NR == 1 {print $1}' "$checksum")"
          actual="$(sha256sum "$rootfs" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$expected" == "$actual" ]]
          tar -tJf "$rootfs" > release-assets/members
          grep -Fxq container.config release-assets/members
          tar -xOf "$rootfs" container.config > release-assets/container.config
          grep -Fxq 'enable_anland=1' release-assets/container.config
          grep -Fxq 'enable_x11=0' release-assets/container.config
          rm -f release-assets/verified.sha256 release-assets/members release-assets/container.config

      - name: Split rootfs under GitHub asset size limit
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          rootfs=ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz
          split -b 1800M -d -a 2 "$rootfs" "$rootfs.part-"
          shopt -s nullglob
          parts=("$rootfs".part-*)
          shopt -u nullglob
          ((${#parts[@]} > 0))
          sha256sum "${parts[@]}" > "$rootfs.parts.sha256"
          cp "$GITHUB_WORKSPACE/scripts/assemble-rootfs-release.sh" .
          chmod 0755 assemble-rootfs-release.sh
          printf 'Release contains %d rootfs parts. Reassemble with: ./assemble-rootfs-release.sh . ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz\n' \
            "${#parts[@]}" > ASSEMBLE.txt
          ls -lh "${parts[@]}" "$rootfs.sha256" "$rootfs.parts.sha256" "$rootfs.source" assemble-rootfs-release.sh ASSEMBLE.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ArmadaOS Freedom Anland Droidspaces RootFS $RELEASE_TAG" \
            --notes "ARM64 ArmadaOS Freedom Fedora 44 rootfs for Droidspaces with Wayland + Anland KDE support. The rootfs account is armada and is password-locked in this release; enter as root and run passwd armada on first start. This is the restored ArmadaOS account build; the previous v0.1.0-anland.1 release used z. Download all .part-* assets plus the checksum files and assemble with ./assemble-rootfs-release.sh. The script verifies each part and the complete rootfs SHA-256." \
            release-assets/ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz.part-* \
            release-assets/ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz.sha256 \
            release-assets/ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz.parts.sha256 \
            release-assets/ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz.source \
            release-assets/assemble-rootfs-release.sh \
            release-assets/ASSEMBLE.txt
