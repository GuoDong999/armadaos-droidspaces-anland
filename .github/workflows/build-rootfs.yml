name: Build ArmadaOS Freedom Anland RootFS

on:
  workflow_dispatch:
    inputs:
      armada_image:
        description: ARM64 ArmadaOS Freedom container image reference
        required: true
        type: string
        default: ghcr.io/armadaos-freedom/armadaos-freedom@sha256:26e4e9d4b76cb194c8852daada2d257ab7e20078611dd2a6bb2911fe4f6a6a46
      rootfs_username:
        description: Linux account name inside the rootfs
        required: true
        type: string
        default: z

permissions:
  contents: read

jobs:
  build-rootfs:
    name: Build ARM64 rootfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Check out adapter
        uses: actions/checkout@v5

      - name: Check out Droidspaces rootfs builder
        uses: actions/checkout@v5
        with:
          repository: Goldzxcbug/Droidspaces-rootfs-Desktop-builder
          ref: 5017a8862874adea23862bb32b67cfcfec174dfb
          path: source/droidspaces-rootfs-builder

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          sudo apt-get clean
          docker system prune --all --force

      - name: Check builder capacity
        shell: bash
        run: |
          set -euo pipefail
          docker info
          docker buildx inspect --bootstrap
          df -h /
          available_kb="$(df -Pk / | awk 'NR == 2 {print $4}')"
          if (( available_kb < 40000000 )); then
            printf 'At least 40 GB free disk is recommended; only %s KB is available.\n' "$available_kb" >&2
            exit 1
          fi

      - name: Flatten ArmadaOS OCI layers
        env:
          ARMADA_IMAGE_SOURCE: ${{ inputs.armada_image }}
        shell: bash
        run: |
          set -euo pipefail
          version=0.22.1
          archive="$RUNNER_TEMP/go-containerregistry_Linux_arm64.tar.gz"
          curl --http1.1 -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/google/go-containerregistry/releases/download/v${version}/go-containerregistry_Linux_arm64.tar.gz" \
            -o "$archive"
          curl --http1.1 -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/google/go-containerregistry/releases/download/v${version}/checksums.txt" \
            -o "$RUNNER_TEMP/crane-checksums.txt"
          expected="$(awk -v f='go-containerregistry_Linux_arm64.tar.gz' '$2 == f {print $1}' "$RUNNER_TEMP/crane-checksums.txt")"
          test "${#expected}" -eq 64
          printf '%s  %s\n' "$expected" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" crane
          "$RUNNER_TEMP/crane" --platform linux/arm64 export "$ARMADA_IMAGE_SOURCE" "$RUNNER_TEMP/armada-rootfs.tar"
          docker import --platform linux/arm64 "$RUNNER_TEMP/armada-rootfs.tar" armadaos-freedom:flattened
          test "$(docker image inspect armadaos-freedom:flattened --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          rm -f "$RUNNER_TEMP/armada-rootfs.tar" "$archive" "$RUNNER_TEMP/crane-checksums.txt"

      - name: Build rootfs
        env:
          ARMADA_IMAGE: armadaos-freedom:flattened
          ARMADA_IMAGE_SOURCE: ${{ inputs.armada_image }}
          ROOTFS_USERNAME: ${{ inputs.rootfs_username }}
          ROOTFS_PASSWORD: ${{ secrets.ROOTFS_PASSWORD }}
        run: ./build-rootfs.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v6
        with:
          name: ArmadaOS-Freedom-Anland-Droidspaces-aarch64
          path: |
            dist/ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz
            dist/ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz.sha256
            dist/ArmadaOS-Freedom-Droidspaces-aarch64.tar.xz.source
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
